<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Detection Model</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-app: #ffffff; 
            --glass-bg: rgba(255, 255, 255, 0.85); 
            --glass-border: rgba(226, 232, 240, 0.8);
            --text-primary: #0f172a; 
            --text-secondary: #64748b;
            --neon-blue-grad: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
        }

        * { box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background-color: var(--bg-app);
            background-image: 
                radial-gradient(at 0% 0%, rgba(0, 242, 254, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(255, 65, 108, 0.08) 0px, transparent 50%);
            background-attachment: fixed;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            color: var(--text-primary);
        }

        .container {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 50px;
            border-radius: 30px;
            border: 1px solid var(--glass-border);
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.05);
            width: 100%;
            max-width: 650px;
            text-align: center;
        }

        h2 {
            margin-top: 0;
            font-weight: 900;
            font-size: 36px;
            margin-bottom: 10px;
            background: var(--neon-blue-grad);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }

        p.subtitle {
            color: var(--text-secondary);
            font-size: 16px;
            margin-bottom: 40px;
            font-weight: 500;
        }

        textarea {
            width: 100%;
            height: 160px;
            padding: 20px;
            background-color: #f8fafc; 
            border-radius: 20px;
            border: 2px solid #e2e8f0;
            font-size: 16px;
            font-family: inherit;
            resize: none;
            outline: none;
            transition: all 0.3s ease;
            color: var(--text-primary);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.02);
            /* תמיכה בעיצוב גלילה לדפדפני פיירפוקס */
            scrollbar-width: thin;
            scrollbar-color: rgba(79, 172, 254, 0.6) transparent;
        }

        /* --- עיצוב פס הגלילה המותאם אישית --- */
        textarea::-webkit-scrollbar {
            width: 8px; /* רובי פס הגלילה */
        }

        textarea::-webkit-scrollbar-track {
            background: transparent; /* מסילה שקופה */
            margin-top: 10px;
            margin-bottom: 10px;
        }

        textarea::-webkit-scrollbar-thumb {
            background-color: rgba(79, 172, 254, 0.4); /* צבע כחול עדין לפס */
            border-radius: 10px; /* פינות עגולות */
        }

        textarea::-webkit-scrollbar-thumb:hover {
            background-color: rgba(79, 172, 254, 0.8); /* צבע חזק יותר במעבר עכבר */
        }
        /* ------------------------------------ */

        textarea:focus {
            background-color: #ffffff;
            border-color: #4facfe;
            box-shadow: 0 0 20px rgba(79, 172, 254, 0.2);
        }

        textarea::placeholder { color: #94a3b8; }

        button {
            background: var(--neon-blue-grad);
            color: white;
            border: none;
            padding: 18px 30px;
            font-size: 18px;
            font-weight: 700;
            border-radius: 20px;
            cursor: pointer;
            width: 100%;
            margin-top: 30px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px -5px rgba(79, 172, 254, 0.4);
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        button:hover {
            transform: translateY(-3px) scale(1.02);
            box-shadow: 0 15px 30px -5px rgba(79, 172, 254, 0.6);
        }

        button:disabled {
            background: #cbd5e1;
            color: #f8fafc;
            cursor: not-allowed;
            box-shadow: none;
            transform: none;
        }

        #result-wrapper {
            margin-top: 40px;
            display: none;
            flex-direction: column;
            align-items: center;
            animation: fadeIn 0.5s ease;
        }

        .circle-container {
            position: relative;
            width: 220px;
            height: 220px;
        }

        .loader {
            display: none;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            background: var(--neon-blue-grad);
            margin: 40px auto;
            animation: pulse 1s infinite ease-in-out;
            box-shadow: 0 0 20px rgba(79, 172, 254, 0.4);
        }

        svg {
            transform: rotate(-90deg);
            width: 100%;
            height: 100%;
        }

        .bg-circle {
            fill: none;
            stroke: #f1f5f9; 
            stroke-width: 16;
        }

        .progress-circle {
            fill: none;
            stroke-width: 16;
            stroke-linecap: round;
            stroke-dasharray: 578; 
            stroke-dashoffset: 578; 
            transition: stroke-dashoffset 2s cubic-bezier(0.2, 1, 0.2, 1);
            filter: drop-shadow(0 0 10px currentColor);
        }

        .inner-circle-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            width: 100%;
            height: 100%;
        }

        .result-title {
            font-size: 32px; 
            font-weight: 900;
            line-height: 1.2;
            margin-bottom: 2px;
            letter-spacing: 1px;
        }

        .percentage {
            font-size: 26px; 
            font-weight: 700;
            line-height: 1;
        }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse {
            0% { transform: scale(0.8); opacity: 0.5; }
            50% { transform: scale(1); opacity: 1; }
            100% { transform: scale(0.8); opacity: 0.5; }
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>AI DETECTION MODEL</h2>
        <p class="subtitle">Advanced linguistic analysis to determine origin probability.</p>
        
        <textarea id="userInput" placeholder="Awaiting text payload input..."></textarea>
        <button id="checkBtn" onclick="sendText()">INITIALIZE SCAN</button>
        
        <div id="loading" class="loader"></div>

        <div id="result-wrapper">
            <div class="circle-container">
                <svg>
                    <defs>
                        <linearGradient id="ai-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#ff416c" />
                            <stop offset="100%" stop-color="#ff4b2b" />
                        </linearGradient>
                        <linearGradient id="human-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
                            <stop offset="0%" stop-color="#00f2fe" />
                            <stop offset="100%" stop-color="#4facfe" />
                        </linearGradient>
                    </defs>
                    <circle class="bg-circle" cx="110" cy="110" r="92"></circle>
                    <circle class="progress-circle" id="progressCircle" cx="110" cy="110" r="92"></circle>
                </svg>
                <div class="inner-circle-content">
                    <div class="result-title" id="statusText"></div>
                    <div class="percentage" id="percentageText">0%</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function animateValue(obj, start, end, duration) {
            let startTimestamp = null;
            const step = (timestamp) => {
                if (!startTimestamp) startTimestamp = timestamp;
                const progress = Math.min((timestamp - startTimestamp) / duration, 1);
                const easeProgress = 1 - Math.pow(1 - progress, 3); 
                obj.innerHTML = Math.floor(easeProgress * (end - start) + start) + "%";
                if (progress < 1) {
                    window.requestAnimationFrame(step);
                }
            };
            window.requestAnimationFrame(step);
        }

        async function sendText() {
            const text = document.getElementById("userInput").value;
            const btn = document.getElementById("checkBtn");
            const loader = document.getElementById("loading");
            const resultWrapper = document.getElementById("result-wrapper");
            const progressCircle = document.getElementById("progressCircle");
            const percentageText = document.getElementById("percentageText");
            const statusText = document.getElementById("statusText");
            
            if (!text.trim()) return;

            btn.disabled = true;
            btn.innerText = "SCANNING...";
            resultWrapper.style.display = "none";
            loader.style.display = "block";
            progressCircle.style.strokeDashoffset = 578; 

            try {
                const response = await fetch("http://localhost:8000/predict", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ text: text })
                });

                const data = await response.json();
                const prediction = data.prediction;
                const confidence = data.confidence; 
                
                loader.style.display = "none";
                resultWrapper.style.display = "flex";

                let activeGradient = "";

                if (prediction === "AI") {
                    statusText.innerText = "AI";
                    progressCircle.style.stroke = "url(#ai-gradient)";
                    progressCircle.style.color = "#ff416c"; 
                    activeGradient = "linear-gradient(135deg, #ff416c 0%, #ff4b2b 100%)";
                    
                } else {
                    statusText.innerText = "HUMAN";
                    progressCircle.style.stroke = "url(#human-gradient)";
                    progressCircle.style.color = "#4facfe"; 
                    activeGradient = "linear-gradient(135deg, #00f2fe 0%, #4facfe 100%)";
                }
                
                statusText.style.background = activeGradient;
                statusText.style.webkitBackgroundClip = "text";
                statusText.style.webkitTextFillColor = "transparent";
                
                percentageText.style.background = activeGradient;
                percentageText.style.webkitBackgroundClip = "text";
                percentageText.style.webkitTextFillColor = "transparent";

                const circumference = 578;
                const offset = circumference - (confidence / 100) * circumference;
                
                setTimeout(() => {
                    progressCircle.style.strokeDashoffset = offset;
                    animateValue(percentageText, 0, confidence, 2000);
                }, 100);

            } catch (error) {
                loader.style.display = "none";
                alert("Server Connection Failed.");
            } finally {
                btn.disabled = false;
                btn.innerText = "INITIALIZE SCAN";
            }
        }
    </script>
</body>
</html>
